# Checks every PR against `deploy` (production) before anyone merges it.
# The weekly upstream routine opens PRs but can't run upstream code in its sandbox, so this is where they get tested.
name: CI
on:
  pull_request:
    branches: [deploy]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
